
services:
  app:
    build: .
    container_name: hola-mundo-app
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: hola-mundo-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_demo
      MYSQL_DATABASE: hola_mundo
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
